<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="微墨 ink drop logo">
  <!-- 微墨·豆瓣 墨滴标：黑白双稿口径（weimo-logo.svg 浓墨 / weimo-logo-white.svg
       纸白渐变），favicon 无法继承页面文字色，由内嵌 style 按系统明暗主题切换
       stop 配色——亮色浓墨、暗色 #fff→#f7f7f7→#d8d8d8 纸白，高光双稿同为白色 -->
  <style>
    .tone-a { stop-color: #1b1d23; stop-opacity: 0.96; }
    .tone-b { stop-color: #1b1d23; }
    .tone-c { stop-color: #1b1d23; stop-opacity: 0.82; }
    @media (prefers-color-scheme: dark) {
      .tone-a { stop-color: #ffffff; stop-opacity: 1; }
      .tone-b { stop-color: #f7f7f7; }
      .tone-c { stop-color: #d8d8d8; stop-opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="dropTone" x1="0.18" y1="0.08" x2="0.82" y2="0.94">
      <stop offset="0" class="tone-a"/>
      <stop offset="0.58" class="tone-b"/>
      <stop offset="1" class="tone-c"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <path fill="url(#dropTone)" d="M256 54
    C241 111 220 153 184 202
    C148 251 119 291 119 343
    C119 421 178 468 256 468
    C334 468 393 421 393 343
    C393 291 364 251 328 202
    C292 153 271 111 256 54 Z"/>
  <path fill="url(#glint)" d="M246 112
    C233 157 213 192 187 231
    C163 267 151 295 151 323
    C151 341 157 354 168 361
    C179 368 190 357 195 340
    C204 309 220 279 240 247
    C259 217 266 181 246 112 Z"/>
</svg>
