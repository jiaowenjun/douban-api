[package]
name = "douban-export"
version = "0.1.0"
edition = "2021"
description = "免登录导出豆瓣用户的公开书影音标记与短评"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
rust_xlsxwriter = "0.79"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
